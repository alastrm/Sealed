services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sealed-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./whistleblower.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/investigators/public-key')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - sealed-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sealed-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sealed-network

networks:
  sealed-network:
    driver: bridge
